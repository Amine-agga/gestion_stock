# --------------------------
# APPLICATION
# --------------------------
spring.application.name=ms-gateway
spring.cloud.compatibility-verifier.enabled=false
server.port=8080

# --------------------------
# EUREKA CLIENT
# --------------------------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ============ ROUTES USER SERVICE ============

# Login (PUBLIC)
spring.cloud.gateway.routes[0].id=auth-login
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/login
spring.cloud.gateway.routes[0].predicates[1]=Method=POST

# Create User
spring.cloud.gateway.routes[1].id=auth-create-user
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/create
spring.cloud.gateway.routes[1].predicates[1]=Method=POST
spring.cloud.gateway.routes[1].filters[0]=JwtAuthentication

# Get All Users
spring.cloud.gateway.routes[2].id=auth-list-users
spring.cloud.gateway.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auth/users
spring.cloud.gateway.routes[2].predicates[1]=Method=GET
spring.cloud.gateway.routes[2].filters[0]=JwtAuthentication

# Delete User
spring.cloud.gateway.routes[3].id=auth-delete-user
spring.cloud.gateway.routes[3].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/auth/user/*
spring.cloud.gateway.routes[3].predicates[1]=Method=DELETE
spring.cloud.gateway.routes[3].filters[0]=JwtAuthentication

# Get/Update User
spring.cloud.gateway.routes[4].id=auth-user-profile
spring.cloud.gateway.routes[4].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/auth/user/**
spring.cloud.gateway.routes[4].predicates[1]=Method=GET,PUT,PATCH
spring.cloud.gateway.routes[4].filters[0]=JwtAuthentication

