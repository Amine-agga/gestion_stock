server.port=9000

# Database
spring.datasource.url=jdbc:postgresql://localhost:5434/produit_db
spring.datasource.username=admin
spring.datasource.password=password

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Désactiver la vérification de compatibilité
spring.cloud.compatibility-verifier.enabled=false

# Forcer le démarrage même avec compatibilité
spring.main.allow-bean-definition-overriding=true

# Swagger (optionnel si vous gardez REST)
#springdoc.swagger-ui.path=/swagger-ui.html
#springdoc.api-docs.path=/api-docs
#springdoc.swagger-ui.operationsSorter=method

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Application name (IMPORTANT pour Eureka)
spring.application.name=ms-produit