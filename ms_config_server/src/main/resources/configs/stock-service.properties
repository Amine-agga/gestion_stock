# Application
spring.application.name=stock-service
server.port=9001

# Database
spring.datasource.url=jdbc:postgresql://localhost:5435/stock_db
spring.datasource.username=admin
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# EUREKA CLIENT CONFIGURATION
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# SPRING BATCH CONFIGURATION
# Désactiver le lancement automatique au démarrage (lancé par le scheduler uniquement)
spring.batch.job.enabled=false
# Initialiser le schéma Spring Batch automatiquement dans la base de données
spring.batch.jdbc.initialize-schema=always
# Configuration du pool de threads pour le scheduler
spring.task.scheduling.pool.size=5
# Logging pour Spring Batch (optionnel - pour le debug)
logging.level.org.springframework.batch=INFO
logging.level.com.example.ms_stock.batch=DEBUG

# EMAIL CONFIGURATION
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=stockflowsf@gmail.com
spring.mail.password=fruc yugz ccjk vxlc

# Propriétés SMTP (IMPORTANT - ces lignes manquent !)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# STOCK ALERT EMAIL CONFIGURATION
# Activer/désactiver l'envoi d'emails
stock.alert.email.enabled=true
# Email expéditeur (affiché dans le champ "From")
stock.alert.email.from=noreply@stock-management.com
# Email(s) destinataire(s) - séparés par des virgules
stock.alert.email.recipients=stockflowsf@gmail.com
# Mode d'envoi des emails
stock.alert.email.send-individual=false
stock.alert.email.send-summary=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method