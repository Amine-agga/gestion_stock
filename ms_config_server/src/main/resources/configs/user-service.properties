# Application
spring.application.name=user-service
server.port=9002

# Database (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5433/user_db
spring.datasource.username=admin
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration ? IMPORTANT
jwt.secret=1335f3d7048a490bfa5bc3f0275cae0e85a51ee99aaa8dc970e60ed6bd4fafd6
jwt.expiration=86400000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Logging
logging.level.com.example.ms_user=DEBUG
logging.level.org.springframework.security=DEBUG